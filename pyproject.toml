[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climbmix"
version = "1.0.0"
description = "CLIMB: CLustering-based Iterative Data Mixture Bootstrapping for Language Model Pre-training"
readme = "README.md"
license = {text = "Apache 2.0"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
    "pandas>=2.0",
    "pyarrow>=10.0",
    "torch>=2.0",
    "matplotlib>=3.7",
    "sentence-transformers>=2.0",
    "faiss-cpu>=1.7",
]

[project.urls]
Homepage = "https://github.com/liujin99/climbmix"
Paper = "https://arxiv.org/abs/2504.13161"

[tool.setuptools.packages.find]
where = ["src"]
include = ["climbmix*"]

[tool.setuptools.package-data]
climbmix = ["py.typed"]
